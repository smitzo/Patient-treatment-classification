[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "classification-lab"
version = "0.1.0"
description = "Reproducible educational classification experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "scikit-learn>=1.5,<1.8", "matplotlib>=3.8,<4"]

[project.scripts]
classification-lab = "classification_lab.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1", "build>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
classification_lab = ["resources/*.csv", "resources/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
